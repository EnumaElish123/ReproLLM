name: Bug report
description: Something behaved incorrectly or crashed.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the incorrect behavior. If ReproLLM crashed, paste the traceback (run with -v for the internal traceback).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: reprollm version
      description: Output of `reprollm --version`
      placeholder: "reprollm 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Which command?
      options:
        - reprollm audit
        - reprollm init
        - reprollm lock
        - reprollm run / runs
        - reprollm diff
        - reprollm export
        - reprollm discover
        - reprollm rules
        - reprollm doctor
        - reprollm schema export
        - other / not command-specific
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID (if an audit finding is wrong)
      description: e.g. `model.revision_pinned` — leave empty otherwise
      placeholder: "model.revision_pinned"
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Commands, manifest fragment, or fixture tree that triggers the bug. Redact secrets.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / platform
      placeholder: "Ubuntu 24.04, Python 3.12"
