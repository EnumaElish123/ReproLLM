[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reprollm"
dynamic = ["version"]
description = "A reproducibility linter, experiment recorder, lockfile system, and drift detector for LLM research."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ReproLLM maintainers" }]
keywords = [
    "reproducibility",
    "llm",
    "machine-learning",
    "research",
    "audit",
    "lockfile",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "jinja2>=3.1",
    "httpx>=0.27",
    "packaging>=24.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
reprollm = "reprollm.cli.main:app"

[project.urls]
Homepage = "https://github.com/EnumaElish123/ReproLLM"
Repository = "https://github.com/EnumaElish123/ReproLLM"
Issues = "https://github.com/EnumaElish123/ReproLLM/issues"
Changelog = "https://github.com/EnumaElish123/ReproLLM/blob/main/CHANGELOG.md"
Documentation = "https://github.com/EnumaElish123/ReproLLM/tree/main/docs"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "jsonschema>=4.21",
]

[tool.hatch.version]
path = "src/reprollm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reprollm"]

[tool.hatch.build.targets.sdist]
exclude = ["tests", "docs", "examples"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "linux_only: tests that may only run on Linux runners",
    "network: tests that require real network access (forbidden in CI; see spec S22 T-04)",
]
