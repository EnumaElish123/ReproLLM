name: ReproLLM Audit
description: Deterministic reproducibility audit for LLM experiments — model revisions, prompt hashes, generation parameters, drift detection.
branding:
  icon: check-circle
  color: blue

inputs:
  path:
    description: Repository directory to audit
    required: false
    default: .
  fail-on:
    description: Exit 1 when findings reach this severity (critical | warning | never)
    required: false
    default: critical
  level:
    description: Force a lower audit level (0 | 1 | 2 | auto)
    required: false
    default: auto
  version:
    description: ReproLLM version to install (e.g. 0.5.0, latest)
    required: false
    default: latest
  check-lock:
    description: Also run `reprollm lock --check` (exit 1 when stale)
    required: false
    default: "false"

outputs:
  critical-count:
    description: Number of CRITICAL findings
    value: ${{ steps.audit.outputs.critical-count }}
  warning-count:
    description: Number of WARNING findings
    value: ${{ steps.audit.outputs.warning-count }}

runs:
  using: composite
  steps:
    - name: Install ReproLLM
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "latest" ]; then
          pip install reprollm
        else
          pip install "reprollm==${{ inputs.version }}"
        fi

    - name: Run audit
      id: audit
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        AUDIT_EXIT=0
        reprollm audit . \
          --format json \
          --output reprollm-audit.json \
          --fail-on ${{ inputs.fail-on }} \
          ${{ inputs.level != 'auto' && format('--level {0}', inputs.level) || '' }} \
          || AUDIT_EXIT=$?

        # Usage/internal failures do not produce a report; never reuse an old one.
        if [ "${AUDIT_EXIT:-0}" -gt 1 ]; then
          echo "::error title=ReproLLM audit::Audit failed before generating reprollm-audit.json; counts unavailable."
          exit "$AUDIT_EXIT"
        fi
        if [ ! -f reprollm-audit.json ]; then
          echo "::error title=ReproLLM audit::No reprollm-audit.json was generated; counts unavailable."
          if [ "$AUDIT_EXIT" -eq 0 ]; then
            AUDIT_EXIT=3
          fi
          exit "$AUDIT_EXIT"
        fi
        echo "report-written=true" >> "$GITHUB_OUTPUT"

        # Derive every presentation from the same report without another audit.
        PRESENTATION_EXIT=0
        python -X utf8 - <<'PY' || PRESENTATION_EXIT=$?
        import json
        import os
        from reprollm.reporters.github import render_audit_github
        from reprollm.schemas.finding import AuditReport
        with open("reprollm-audit.json", encoding="utf-8") as stream:
            report = AuditReport.model_validate(json.load(stream))
        annotations = render_audit_github(report)
        critical = report.summary.critical
        warning = report.summary.warning
        summary = (
            "## ReproLLM Audit\n\n| Severity | Count |\n|---|---|\n"
            f"| CRITICAL | {critical} |\n| WARNING | {warning} |\n\n"
            "Full report: [reprollm-audit.json](#artifacts)\n"
        )
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
            stream.write(f"critical-count={critical}\nwarning-count={warning}\n")
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
            stream.write(summary)
        print(annotations, end="")
        PY
        if [ "$PRESENTATION_EXIT" -ne 0 ]; then
          echo "::error title=ReproLLM audit::Cannot render reprollm-audit.json; counts unavailable. See the previous error."
          if [ "${AUDIT_EXIT:-0}" -eq 0 ]; then
            AUDIT_EXIT=3
          fi
        fi

        exit "${AUDIT_EXIT:-0}"

    - name: Check lock freshness
      if: inputs.check-lock == 'true'
      shell: bash
      working-directory: ${{ inputs.path }}
      run: reprollm lock --check .

    - name: Upload audit report
      if: ${{ !cancelled() && steps.audit.outputs.report-written == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: reprollm-audit
        path: ${{ inputs.path }}/reprollm-audit.json
        if-no-files-found: warn
