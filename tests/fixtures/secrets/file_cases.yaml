# Filename classification corpus for the §16.4 forbidden-file matcher.
# Consumed by M2 tests (core.redaction.is_forbidden_file); every glob in the
# spec appears as a positive case, including nested-directory forms.
forbidden:
  - .env
  - .env.local
  - .env.production
  - config/.env
  - deploy/.env.staging
  - server.pem
  - certs/api.pem
  - secrets/api.key
  - id_rsa
  - id_rsa_github
  - id_ed25519
  - id_ed25519_work
  - credentials.json
  - credentials_backup.txt
  - cert.p12
  - bundle.pfx
  - keystore.jks
  - host_rsa
  - .netrc
  - .npmrc
  - .pypirc
allowed:
  - .env.example
  - .env.sample
  - .env.template
  - main.py
  - README.md
  - environment.yml
  - requirements.txt
  - keynote.md
  - rsa_notes.txt
  - my_id_rsa.txt
  - x509.pub
  - server.PEM.pub
case_insensitive_forbidden:
  - SERVER.PEM
  - .ENV
  - Credentials.JSON
  - ID_RSA
