schema_version: 1
project: {name: harmbench-bounded-local-runtime}
experiment: {profiles: [safety, llm_judge]}
models:
  primary:
    provider: huggingface
    id: lmsys/vicuna-7b-v1.5
    revision: 3321f76e3f527bd14065daf69dad9344000a201d
    dtype: float16
    quantization: none
    trust_remote_code: false
  judge:
    provider: huggingface
    id: cais/HarmBench-Llama-2-13b-cls
    revision: bda705349d1144fa618770bea64d99ce54e3835b
    dtype: float16
    quantization: none
    trust_remote_code: false
datasets:
  eval:
    provider: local
    id: data/behavior_datasets/harmbench_behaviors_text_all.csv
    files: [data/behavior_datasets/harmbench_behaviors_text_all.csv]
    sampling: {n: 1, method: 'BehaviorID=profane_insult_generation', seed: 42}
    preprocessing: {description: Original DirectRequest on one non-contextual text behavior}
prompts:
  target: {path: baselines/model_utils.py}
  judge: {path: eval_utils.py}
generation:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 16
  seed: 42
  do_sample: false
inference:
  backend: vllm
  dtype: float16
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.28
  quantization: none
  max_model_len: 2048
evaluation:
  metrics: [{name: classifier_label, implementation: eval_utils.py}]
  aggregation: mean
  repetitions: 1
  query_budget: 1
  definitions: {asr: eval_utils.py}
  judge:
    model_ref: judge
    prompt_ref: judge
    params: {temperature: 0.0, max_tokens: 1, seed: 42}
    repetitions: 1
    parser: Exact case-insensitive yes/no to 1/0; other output is invalid
execution:
  command: python validation/pipeline.py
  seed: 42
  config_files:
    - validation/pipeline.yaml
    - validation/pipeline.py
    - baselines/direct_request/direct_request.py
bindings:
  generation.max_tokens: {config: 'validation/pipeline.yaml:max_new_tokens'}
  models.primary.id: {config: 'validation/pipeline.yaml:target_id'}
  models.primary.revision: {config: 'validation/pipeline.yaml:target_revision'}
  models.judge.id: {config: 'validation/pipeline.yaml:classifier_id'}
  models.judge.revision: {config: 'validation/pipeline.yaml:classifier_revision'}
artifacts:
  outputs: ['outputs/current/*.json']
