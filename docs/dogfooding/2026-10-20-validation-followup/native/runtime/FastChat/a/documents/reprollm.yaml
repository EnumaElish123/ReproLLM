schema_version: 1
project: {name: fastchat-local-answer-supplement}
experiment: {profiles: [evaluation]}
models:
  primary:
    provider: huggingface
    id: lmsys/vicuna-7b-v1.5
    revision: 3321f76e3f527bd14065daf69dad9344000a201d
    dtype: float16
    quantization: none
    trust_remote_code: false
datasets:
  eval:
    provider: local
    id: fastchat/llm_judge/data/mt_bench/question.jsonl
    files: [fastchat/llm_judge/data/mt_bench/question.jsonl]
    sampling: {n: 1, method: first, seed: 0}
    preprocessing: {description: 'Native first MT-Bench question, both turns, one choice'}
prompts:
  conversation: {path: fastchat/conversation.py}
generation: {temperature: 0.7, max_tokens: 32, seed: 0, do_sample: true}
inference: {backend: transformers, dtype: float16}
execution:
  command: python validation/answer_entry.py
  seed: 0
  config_files: [validation/answer.yaml, validation/answer_entry.py, fastchat/llm_judge/gen_model_answer.py]
bindings:
  generation.max_tokens: {config: 'validation/answer.yaml:max_new_tokens'}
  models.primary.id: {config: 'validation/answer.yaml:model_id'}
  models.primary.revision: {config: 'validation/answer.yaml:model_revision'}
artifacts:
  outputs: ['outputs/current/*.jsonl']
