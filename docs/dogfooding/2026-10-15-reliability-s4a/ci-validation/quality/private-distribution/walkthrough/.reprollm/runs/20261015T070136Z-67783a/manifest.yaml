schema_version: 1
project:
  name: capture-tour
experiment:
  profiles:
  - inference
  - evaluation
models:
  primary:
    provider: huggingface
    id: Qwen/Qwen3-32B
    dtype: bfloat16
    quantization: none
datasets:
  eval:
    provider: huggingface
    id: cais/mmlu
    subset: abstract_algebra
    split: test
    preprocessing:
      description: Read the MMLU question and compare the generated answer.
    sampling:
      n: 100
      method: first_n
      seed: 0
prompts:
  system:
    path: prompts/system.txt
    few_shot:
      n: 0
generation:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 32
  seed: 42
  stop: []
inference:
  backend: vllm
  dtype: bfloat16
  tensor_parallel_size: 2
  quantization: none
  gpu_memory_utilization: 0.9
evaluation:
  metrics:
  - name: accuracy
    implementation: eval.py
  aggregation: mean
  repetitions: 1
execution:
  command: python capture_probe.py --config configs/capture.json
  seed: 42
  config_files:
  - configs/capture.json
bindings:
  generation.temperature:
    config: configs/capture.json:generation.temperature
  generation.max_tokens:
    config: configs/capture.json:generation.max_tokens
