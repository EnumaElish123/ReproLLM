<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">ReproLLM — reproducibility for LLM research</title>
  <desc id="desc">Audit the setup, record the run, and explain what changed. A manifest records intent, a lockfile records resolved inputs, and a run record captures observations. Audit, diff, and export turn that state into research evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111d33"/>
      <stop offset="1" stop-color="#09111f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#85eed0"/>
      <stop offset="1" stop-color="#81a6ff"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30415e" opacity=".38"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="m1 1 4 3-4 3" fill="none" stroke="#85eed0" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="22" fill="url(#background)"/>
  <rect x="612" width="588" height="440" rx="22" fill="url(#grid)"/>
  <path d="M612 42v356" stroke="#253650"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="56" y="64" fill="#9bafcb" font-size="13" letter-spacing="2.3">REPRODUCIBILITY FOR LLM RESEARCH</text>
    <g fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 140v-24h30l20 20v40H80l-20-20"/>
      <path d="M90 116v20h20M74 150h22M80 160h16"/>
      <path d="m56 153 8-8 8 8"/>
    </g>
    <text x="131" y="172" fill="#f4f8ff" font-size="66" font-weight="750" letter-spacing="-3">ReproLLM</text>
    <text x="56" y="230" fill="#e2eafa" font-size="25" font-weight="500">Audit the setup. Record the run.</text>
    <text x="56" y="265" fill="#85eed0" font-size="25" font-weight="500">Explain what changed.</text>
    <text x="56" y="309" fill="#a9b9d0" font-size="16">Evidence you can review, compare, and share.</text>
    <g font-size="13" font-weight="600" fill="#c6d4e8">
      <rect x="56" y="349" width="101" height="32" rx="16" fill="#192940" stroke="#314762"/>
      <text x="106.5" y="370" text-anchor="middle">CLI-first</text>
      <rect x="169" y="349" width="109" height="32" rx="16" fill="#192940" stroke="#314762"/>
      <text x="223.5" y="370" text-anchor="middle">Local-first</text>
      <rect x="290" y="349" width="127" height="32" rx="16" fill="#192940" stroke="#314762"/>
      <text x="353.5" y="370" text-anchor="middle">No telemetry</text>
    </g>
    <g>
      <rect x="652" y="69" width="150" height="146" rx="12" fill="#15243a" stroke="#35506b"/>
      <rect x="821" y="69" width="150" height="146" rx="12" fill="#15243a" stroke="#35506b"/>
      <rect x="990" y="69" width="150" height="146" rx="12" fill="#15243a" stroke="#35506b"/>
      <g fill="#91a9c8" font-size="12" letter-spacing="1.3">
        <text x="670" y="98">01 / DECLARE</text>
        <text x="839" y="98">02 / RESOLVE</text>
        <text x="1008" y="98">03 / CAPTURE</text>
      </g>
      <g fill="#f2f6ff" font-size="22" font-weight="600">
        <text x="670" y="135">Intent</text>
        <text x="839" y="135">Resolved</text>
        <text x="1008" y="135">Observed</text>
      </g>
      <g fill="#9dcced" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12.5">
        <text x="670" y="162">reprollm.yaml</text>
        <text x="839" y="162">reprollm.lock</text>
        <text x="1008" y="162">run.json</text>
      </g>
      <g fill="#3d5e7f">
        <rect x="670" y="182" width="88" height="4" rx="2"/>
        <rect x="670" y="192" width="56" height="4" rx="2"/>
        <rect x="839" y="182" width="95" height="4" rx="2"/>
        <rect x="839" y="192" width="68" height="4" rx="2"/>
        <rect x="1008" y="182" width="78" height="4" rx="2"/>
        <rect x="1008" y="192" width="98" height="4" rx="2"/>
      </g>
      <path d="M727 215v23h169m169-23v23H896m0-23v49" fill="none" stroke="#85eed0" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="652" y="275" width="488" height="97" rx="12" fill="#162b37" stroke="#3e766f"/>
      <circle cx="680" cy="307" r="5" fill="#85eed0"/>
      <text x="696" y="315" fill="#effffb" font-size="23" font-weight="600">Compare. Explain. Share.</text>
      <text x="676" y="347" fill="#a9d9d0" font-size="15" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace">audit  /  diff  /  export</text>
    </g>
    <text x="652" y="410" fill="#8ea7c4" font-size="13">LLM discovers. Rules decide. Runtime verifies.</text>
  </g>
</svg>
