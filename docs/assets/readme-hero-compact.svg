<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc">
  <title id="title">ReproLLM</title>
  <desc id="desc">Reproducibility for LLM research. Audit the setup, record the run, explain what changed.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111d33"/>
      <stop offset="1" stop-color="#09111f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" rx="20" fill="url(#background)"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    <text x="300" y="52" font-size="17" letter-spacing="1.5" fill="#a9b9d0">REPRODUCIBILITY FOR LLM RESEARCH</text>
    <text x="300" y="140" font-size="76" font-weight="750" letter-spacing="-3" fill="#f4f8ff">ReproLLM</text>
    <path d="M246 167h108" stroke="#85eed0" stroke-width="3" stroke-linecap="round"/>
    <text x="300" y="211" font-size="23" fill="#e2eafa">Audit the setup. Record the run.</text>
    <text x="300" y="246" font-size="23" fill="#85eed0">Explain what changed.</text>
  </g>
</svg>
