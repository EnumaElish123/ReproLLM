# The implicit baseline profile; always included and never listed in
# experiment.profiles (spec §6). Rules are completed sprint by sprint:
# M3 adds the L1 catalog, M4 the L2 rules.
schema_version: 1
name: core
description: Baseline rules applied to every repository.
rules:
  - code.git_repo
  - code.git_commit
  - code.clean_tree
  - code.no_untracked
  - code.submodules_initialized
  - code.remote_recorded
  - env.dependency_manifest_present
  - env.lockfile_present
  - env.llm_critical_deps_pinned
  - env.python_version_declared
  - env.secret_files_ignored
  - env.reprollm_initialized
  - exec.command_declared
  - exec.seed_declared
  - exec.run_recorded
  - exec.profile_detection_mismatch
required_fields:
  - project.name
  - models.primary.id
