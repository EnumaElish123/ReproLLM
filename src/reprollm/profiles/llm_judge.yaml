# Level 2 rules remain metadata-only stubs until M4.
schema_version: 1
name: llm_judge
description: LLM-as-a-judge evaluation (judge model, prompt, and parameters).
extends: [evaluation]
rules:
  - judge.model_declared
  - judge.prompt_declared
  - judge.prompt_hashed
  - judge.params_declared
  - judge.pinnability_recorded
  - judge.repetitions_declared
required_fields:
  - models.judge.id
  - prompts.judge.path
  - evaluation.judge.params.temperature
severity_overrides: {}
drift_overrides:
  "evaluation.judge.*": HIGH
detect:
  imports: []
  dependencies: []
  keywords: [judge, llm-as-a-judge, llm_judge, rubric, grader]
  files: []
