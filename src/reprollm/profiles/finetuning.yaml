# Presence rules and severity overrides follow spec §6.1.
schema_version: 1
name: finetuning
description: Fine-tuning experiments (method, hyperparameters, adapters).
extends: [core]
rules:
  - model.adapter_declared
  - dataset.declared
  - dataset.preprocessing_declared
  - train.method_declared
  - train.hyperparameters_declared
  - train.optimizer_declared
  - train.precision_declared
  - train.lora_config_complete
required_fields:
  - training.method
  - training.learning_rate
  - datasets.train.id
severity_overrides:
  exec.seed_declared: CRITICAL
  dataset.declared: CRITICAL
drift_overrides: {}
detect:
  imports: [peft, trl, deepspeed, accelerate]
  dependencies: [peft, trl, deepspeed, accelerate]
  keywords: [lora, fine-tun, finetun, sft, dpo, rlhf]
  files: []
